name: Unpack D-Safe V36.4.114

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract D-Safe package
        shell: bash
        run: |
          set -euo pipefail

          ZIP="dsafe-ppt-generator-v36.4.114-google-drive-test-final.zip"
          TMP="/tmp/dsafe-v364114"

          test -f "$ZIP"

          rm -rf "$TMP"
          mkdir -p "$TMP"

          unzip -q "$ZIP" -d "$TMP"

          SRC="$TMP/dsafe-ppt-generator-v36.4.114-google-drive-test"

          test -f "$SRC/app.py"
          test -f "$SRC/requirements.txt"

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            "$SRC/" ./

          rm -f "$ZIP"

      - name: Commit extracted application
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi

          git commit -m "Install D-Safe V36.4.114 Google Drive Test"
          git push
