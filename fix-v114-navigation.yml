name: Fix V36.4.114 Online Navigation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-v114-navigation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-navigation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace home links with native Streamlit click targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          marker = "home_native_grid_v114"
          if marker in text:
              print("Native navigation already installed.")
              raise SystemExit(0)

          start_marker = "if nav == 'Beranda':"
          end_marker = "\nst.button('⌂',key='nav_home_v58'"

          if text.count(start_marker) != 1:
              raise SystemExit("Safety check failed: Beranda block is not unique.")
          if end_marker not in text:
              raise SystemExit("Safety check failed: end of Beranda block not found.")
          if "def _navigate_v36458" not in text:
              raise SystemExit("Safety check failed: navigation callback not found.")

          start = text.index(start_marker)
          end = text.index(end_marker, start)

          new_block = r'''if nav == 'Beranda':
              st.markdown('<style>.stApp::before{display:none !important;}</style>',unsafe_allow_html=True)
              if st.session_state.pop('_home_slide_v59',False):
                  st.markdown("""
                  <style>
                  @keyframes dsafe-home-slide-down{
                    from{opacity:.35;transform:translateY(-55px);}
                    to{opacity:1;transform:translateY(0);}
                  }
                  .home-shell,.home-footer{
                    animation:dsafe-home-slide-down .48s cubic-bezier(.2,.8,.28,1) both;
                  }
                  @media(prefers-reduced-motion:reduce){
                    .home-shell,.home-footer{animation:none !important;}
                  }
                  </style>
                  """,unsafe_allow_html=True)

              home_data=load_book_data()
              home_profile=home_data.get('user_profile') or {}
              home_station=html.escape(home_data.get('station') or 'Belum diisi')
              home_user=html.escape(home_profile.get('name') or 'Belum diisi')
              home_nipp=html.escape(str(home_profile.get('nipp') or '').strip())
              home_nipp_line=f'<span class="hero-nipp">NIPP. {home_nipp}</span>' if home_nipp else ''

              st.markdown("""
              <style>
              .st-key-home_native_grid_v114{
                margin-top:7px !important;
              }
              .st-key-home_native_grid_v114 > div[data-testid="stVerticalBlock"]{
                gap:6px !important;
              }
              .st-key-home_native_book_v114,
              .st-key-home_native_dashboard_v114,
              .st-key-home_native_dsafe_v114,
              .st-key-home_native_safety_v114{
                position:relative !important;
                width:100% !important;
                min-width:0 !important;
                margin:0 !important;
                padding:0 !important;
              }
              .st-key-home_native_book_v114 > div[data-testid="stVerticalBlock"],
              .st-key-home_native_dashboard_v114 > div[data-testid="stVerticalBlock"],
              .st-key-home_native_dsafe_v114 > div[data-testid="stVerticalBlock"],
              .st-key-home_native_safety_v114 > div[data-testid="stVerticalBlock"]{
                gap:0 !important;
              }
              .st-key-home_native_book_click_v114,
              .st-key-home_native_dashboard_click_v114,
              .st-key-home_native_dsafe_click_v114,
              .st-key-home_native_safety_click_v114{
                position:absolute !important;
                inset:0 !important;
                z-index:2147482000 !important;
                width:100% !important;
                height:100% !important;
                margin:0 !important;
                padding:0 !important;
              }
              .st-key-home_native_book_click_v114 button,
              .st-key-home_native_dashboard_click_v114 button,
              .st-key-home_native_dsafe_click_v114 button,
              .st-key-home_native_safety_click_v114 button{
                position:absolute !important;
                inset:0 !important;
                width:100% !important;
                height:100% !important;
                min-height:100% !important;
                margin:0 !important;
                padding:0 !important;
                border:0 !important;
                background:transparent !important;
                box-shadow:none !important;
                opacity:0 !important;
                cursor:pointer !important;
              }
              .st-key-home_native_book_v114:hover .home-card-shell,
              .st-key-home_native_dashboard_v114:hover .home-card-shell,
              .st-key-home_native_dsafe_v114:hover .home-card-shell,
              .st-key-home_native_safety_v114:hover .home-card-shell{
                transform:translateY(-3px) scale(1.012) !important;
                box-shadow:0 12px 24px rgba(30,86,132,.20),0 0 0 2px rgba(20,112,216,.18) !important;
                border-color:#8fc8f4 !important;
              }
              .st-key-home_native_settings_click_v114{
                position:fixed !important;
                right:22px !important;
                bottom:22px !important;
                width:46px !important;
                height:46px !important;
                z-index:2147483646 !important;
                margin:0 !important;
                padding:0 !important;
              }
              .st-key-home_native_settings_click_v114 button{
                position:absolute !important;
                inset:0 !important;
                width:100% !important;
                height:100% !important;
                min-height:100% !important;
                margin:0 !important;
                padding:0 !important;
                border:0 !important;
                background:transparent !important;
                box-shadow:none !important;
                opacity:0 !important;
                cursor:pointer !important;
              }
              @media(max-width:760px){
                .st-key-home_native_settings_click_v114{
                  right:12px !important;
                  bottom:12px !important;
                  width:40px !important;
                  height:40px !important;
                }
              }
              </style>
              """, unsafe_allow_html=True)

              st.markdown(f"""
              <div class='home-shell'>
                <div class='home-hero'>
                  <div class='hero-copy'>
                    <h1 class='hero-title'>PERFORMANCE MONITORING &amp; REPORTING</h1>
                    <p class='hero-subtitle'>Platform untuk mendukung kegiatan keselamatan kerja dan pengelolaan laporan secara efisien.</p>
                    <div class='hero-identity'>
                      <strong class='hero-station'>{home_station}</strong>
                      <span class='hero-user'>{home_user}</span>
                      {home_nipp_line}
                    </div>
                  </div>
                </div>
              </div>
              """, unsafe_allow_html=True)

              with st.container(key='home_native_grid_v114'):
                  with st.container(key='home_native_book_v114'):
                      st.markdown(
                          "<div class='home-card-shell book-card'><div class='home-card-image'></div><div class='home-card-body'><div class='home-card-title'>Buku Kerja</div><div class='home-card-copy'>Input kegiatan, petugas, TTD, dokumentasi, riwayat, dan PDF.</div></div></div>",
                          unsafe_allow_html=True
                      )
                      st.button('Buku Kerja',key='home_native_book_click_v114',on_click=_navigate_v36458,args=('Buku Kerja',))

                  with st.container(key='home_native_dashboard_v114'):
                      st.markdown(
                          "<div class='home-card-shell monitor-card'><div class='home-card-image'></div><div class='home-card-body'><div class='home-card-title'>Dashboard Kinerja</div><div class='home-card-copy'>Rekap minggu, bulan, tahun, dan capaian target tiap petugas.</div></div></div>",
                          unsafe_allow_html=True
                      )
                      st.button('Dashboard Kinerja',key='home_native_dashboard_click_v114',on_click=_navigate_v36458,args=('Dashboard Kinerja',))

                  with st.container(key='home_native_dsafe_v114'):
                      st.markdown(
                          "<div class='home-card-shell dsafe-card'><div class='home-card-image'></div><div class='home-card-body'><div class='home-card-title'>D-Safe</div><div class='home-card-copy'>Generator laporan D-Safe.</div></div></div>",
                          unsafe_allow_html=True
                      )
                      st.button('D-Safe',key='home_native_dsafe_click_v114',on_click=_navigate_v36458,args=('D-Safe',))

                  with st.container(key='home_native_safety_v114'):
                      st.markdown(
                          "<div class='home-card-shell safety-card'><div class='home-card-image'></div><div class='home-card-body'><div class='home-card-title'>Safety Talk Mingguan</div><div class='home-card-copy'>Generator laporan Safety Talk.</div></div></div>",
                          unsafe_allow_html=True
                      )
                      st.button('Safety Talk Mingguan',key='home_native_safety_click_v114',on_click=_navigate_v36458,args=('Safety Talk',))

              st.markdown("<div class='settings-float' aria-hidden='true'>⚙</div>",unsafe_allow_html=True)
              st.button('Pengaturan',key='home_native_settings_click_v114',on_click=_navigate_v36458,args=('Pengaturan',))

              st.markdown(
                  "<div class='home-footer'><div class='kai-brand'><span class='kai-logo'><span class='kai-k'>K</span><span class='kai-a'>A</span><span class='kai-i'>I</span></span><span>PT. Kereta Api Indonesia (Persero)</span></div><div class='footer-tag'>Safe Today&nbsp;&nbsp;|&nbsp;&nbsp;Better Tomorrow</div></div>",
                  unsafe_allow_html=True
              )
              st.stop()
          '''

          path.write_text(text[:start] + new_block + text[end:], encoding="utf-8")
          print("V36.4.114 native navigation patch installed.")
          PY

          python -m py_compile app.py

      - name: Commit navigation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix V36.4.114 online card navigation"
          git push
